<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="robots" content="noindex, follow">
  <title>Page not found | Portfolio</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101114; color: #f4f4f5; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; }
    main { width: min(100%, 42rem); }
    p { color: #c2c3c9; line-height: 1.65; }
    h1 { margin: 0.5rem 0 1rem; font-size: clamp(2rem, 8vw, 4rem); line-height: 1.05; letter-spacing: -0.04em; }
    .eyebrow { color: #c2c3c9; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    a { display: inline-block; margin-top: 1rem; padding: 0.8rem 1rem; border: 1px solid #c2c3c9; border-radius: 0.35rem; color: inherit; text-decoration-thickness: 0.08em; text-underline-offset: 0.2em; }
    a:hover { background: #f4f4f5; color: #101114; }
    a:focus-visible { outline: 3px solid #f4f4f5; outline-offset: 4px; }
    @media (prefers-reduced-motion: no-preference) {
      a { transition: background-color 160ms ease, color 160ms ease; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">404 — Page not found</p>
    <h1>This page took a wrong turn.</h1>
    <p>The address may be outdated, or the page may have moved. Head back to the portfolio to keep exploring.</p>

  </main>
</body>
